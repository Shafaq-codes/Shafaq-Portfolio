<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Soft Backlight inside Box -->
    <radialGradient id="favCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1939" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#e5132b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020204" stop-opacity="0" />
    </radialGradient>

    <!-- Top-Left Corner Specular White Glint -->
    <linearGradient id="favTlWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1838" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff8fa1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff8fa1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff1838" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom-Right Corner Specular White Glint -->
    <linearGradient id="favBrWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1838" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff8fa1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff8fa1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff1838" stop-opacity="0" />
    </linearGradient>

    <!-- Letter 'S' Gradient: Upper white gleam to vivid red to lower white gleam -->
    <linearGradient id="favSShine" x1="18%" y1="18%" x2="82%" y2="82%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#ff7d94" />
      <stop offset="42%" stop-color="#ff1438" />
      <stop offset="78%" stop-color="#e5132b" />
      <stop offset="92%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff2642" />
    </linearGradient>

    <!-- Filter for crisp edge glow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#ff1838" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Black Squircle Body -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#040407" />

  <!-- Center Ambient Volumetric Backlight -->
  <circle cx="32" cy="32" r="24" fill="url(#favCenterGlow)" />

  <!-- Pure Neon Red Outer Squircle Rim (Solid Glowing Red Everywhere) -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#ff1838" stroke-width="3" filter="url(#favGlow)" />

  <!-- ONLY Top-Left Corner Specular White Highlight -->
  <path d="M 4 20 A 16 16 0 0 1 20 4" fill="none" stroke="url(#favTlWhite)" stroke-width="3" stroke-linecap="round" />

  <!-- ONLY Bottom-Right Corner Specular White Highlight -->
  <path d="M 44 60 A 16 16 0 0 0 60 44" fill="none" stroke="url(#favBrWhite)" stroke-width="3" stroke-linecap="round" />

  <!-- Letter 'S' Illuminated Body -->
  <text x="32" y="33.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif"
        font-weight="900" font-size="38" letter-spacing="-0.03em"
        fill="url(#favSShine)" filter="url(#favGlow)">S</text>
</svg>
